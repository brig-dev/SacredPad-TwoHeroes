; SacredPad.ini - settings of SacredPad: Two Heroes
; Put this file next to Sacred.exe, together with version.dll. Lines starting with ";" are comments.
; A missing key keeps its default value, so you can delete what you never change.

[General]
; Language of the mod's texts: Auto (the game's language from Settings.cfg), en, it, de, fr, es
Language=Auto
; Controller: Auto (XInput: Xbox pads, and any pad through Steam Input), XInput, None
; None = player 1 plays with mouse and keyboard, the first controller goes to player 2 of the couch co-op
PadSource=Auto
; XInput slot of player 1's controller (0 = first)
ControllerIndex=0
; Diagnostics: log every key of the keyboard simulator (keep false)
KeyLog=false

[Log]
; SacredPad.log is the log of the latest session. At every start the previous one is kept in the SacredPad_log folder,
; with its date and time in the name. Keep = how many of those to keep (the oldest are deleted); 0 = keep them all.
Keep=50

[Sticks]
; Left stick dead zone (0..1)
LeftDeadzone=0.24
; If the hero does not move with the stick tilted (obstacle, cave entrance), try a farther point and then a rotated one
Unstick=true

[Aim]
; Right stick dead zone (0..1)
RightDeadzone=0.20

[Keys]
; Art slots unlocked by the hero (levels 1, 2, 8, 16, 30): 0 = read from the hero's level, 1..5 = fixed number
UnlockedSlots=0
; Minimap on left stick click: Toggle (press to open, press again to close) or Hold (visible while held)
MinimapMode=Toggle
; D-pad up/down held longer than this (milliseconds) = zoom step; a short press drinks the potion. 0 = no zoom
ZoomHoldMs=350
; true if zoom goes the wrong way
ZoomInvert=false
; Potions on D-pad up and down (game keys): Q = Death of the Undead (purple), W = Mentor (blue),
; E = antidote (green), R = concentration (yellow). The healing potion (red) is on LB.
DpadUpPotion=R
DpadDownPotion=W
; Walking into a portal with the stick goes through it (like A or a click). false = only A
AutoPortal=true

[Cursor]
; Cursor mode (inventory, shops, dialogues, menus): maximum cursor speed, in screen heights per second
CursorSpeed=0.9
; Right stick in cursor mode: fraction of the speed, for fine moves
CursorFine=0.3
; View held longer than this (milliseconds): inventory; a short press switches game / cursor mode
ViewHoldMs=400
; Cursor mode turns on by itself when a game window opens and off when they are all closed
AutoCursor=true

[Memory]
; Reading the game's memory (target lock, co-op, two inventories and everything beyond the basic controller).
; Works only with the Sacred.exe the mod was made for (see Requirements in the README).
MemoryEnabled=true
; Window at start when Sacred.exe is not the recognised one ("No" in that window sets this to false)
WarnWrongExe=true
; Extra diagnostics in the log (for bug hunting only)
MemoryDiag=false

[Overlay]
; Texts and pictures of the mod drawn over the game (help, two players menu, button symbols, player markers)
Enabled=true
; Version and mode at the top of the screen: true (always), Menu (only outside the game world), false (never)
ShowVersion=Menu
; Button names in the help and on the arts: Xbox, DualSense or Steam (also changeable from the help, hold Menu)
PadLayout=Xbox
Pad2Layout=Xbox
; With two players: a ring at each hero's feet (gold player 1, light blue player 2) and an arrow when a hero is off screen
PlayerMarks=true

[Pad]
; Rumble when the hero's portrait flashes red (health below 25%)
Vibration=true
VibrationPower=50

[Lock]
; Automatic target: A and the arts aim at the best living enemy in the direction of the right stick, the left stick
; or the last movement
LockEnabled=true
; Standing still, the pointer rests on what A would choose and the game highlights it
PreviewTarget=true
; Maximum target distance and half-angle of the search cone
LockRange=0.45
LockAngle=50
; With no enemies, A talks to the nearest character, chest or item within this distance
TalkRange=0.22
; Pressing A again within these milliseconds moves on to the next character, chest or item nearby. 0 = off
TalkCycleMs=3000

[Native]
; Couch co-op on the same screen: player 2 controls a second hero in the same game, with a second controller.
; Enabled=false turns all of it off.
Enabled=true
; "Two players" entry in the main menu: split screen (two windows, needs a screen at least 2560 wide) or same screen with hero 2
; chosen from your saved heroes (Save\HeroNN.pax)
Menu=true
; Player 2's controller: -1 = the first one connected that is not player 1's
Pad2Index=-1
Pad2Deadzone=0.35
; Camera on the middle point between the two heroes
Camera=true
; Hero 2 cannot leave the screen or go farther than about 1400 units from hero 1
Pad2EdgeLimit=true
; Enemies near hero 2 attack hero 2 too
Aggro=true
AggroRange=800
; Reviving hero 2 (as in Diablo IV): hero 1 stays close for ReviveNearSeconds; otherwise hero 2 gets up next to
; hero 1 after ReviveSeconds (0 = never)
ReviveNearSeconds=3
ReviveRange=250
ReviveSeconds=30
; Experience of hero 1 shared with hero 2 within ShareXpRange (0 = anywhere); XpFactor multiplies it
ShareXp=true
ShareXpRange=1500
XpFactor=1
; One gold purse for both heroes
SharedGold=true
; Half of the loot and of the shop goods for hero 2's class
SharedLoot=true
; Healing arts on one hero heal the other one too, if near
ShareHeal=true
; Quest items picked up by hero 2 go to hero 1 (quests only look at hero 1)
Hero2QuestItems=true
; Quest rewards: a rune or item for hero 2 too, on the ground next to hero 2; quest attribute and skill points for both
RewardRunes=true
RewardPoints=true
; A rune for one hero's class dropped by a chest comes with a twin for the other hero's class
ChestRunes=true
; Hero 2 also reveals the map, and keeps what was already explored
RevealHero2=true
KeepMap=true
; Both inventories side by side (hero 1 left, hero 2 right), each player with their own game cursor and hand
TwoInventories=true
Mouse2=true
; Companions: their equipment and stats in your column (RT in the backpack), experience, items of any class
CompanionView=true
CompanionXp=true
CompanionAnyClass=true
; Hero 2 is saved in their own Save\HeroNN.pax every time you save (the old file is copied to Save\SacredPad_backup first)
SaveHero2=true
CleanSavedHero2=true
; Hero 2's interface: name bar, second taskbar (hero 1's goes to the left), portrait, own name
Hero2Bar=true
Hero2Taskbar=true
Hero1TaskbarLeft=true
Hero2Portrait=true
Hero2Name=true
; With the shared camera, sounds near either hero are heard as if near the screen centre
AudioBothHeroes=true
